server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Django collected static files ────────────────────────────────────
    # The static_data volume is mounted here by docker-compose (prod/dev).
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media (user-uploaded files) ───────────────────────────────
    # The media_data volume is mounted at /usr/share/nginx/html/media by docker-compose.
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Runtime config — must not be cached ──────────────────────────────
    location = /config/config.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── index.html — must not be cached ──────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Long-lived cache for hashed Angular assets ────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Angular SPA fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
